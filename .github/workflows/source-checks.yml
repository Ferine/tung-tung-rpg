name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run source and asset checks
        run: |
          python checktext.py
          python checkfaces.py

      - name: Regenerate deterministic non-audio assets
        run: |
          python gen_font.py
          python gen_world.py
          python gen_battle.py
          python gen_sprites.py
          python gen_hdma.py
          python gen_title.py

      - name: Require generated assets to be current
        run: git diff --exit-code
