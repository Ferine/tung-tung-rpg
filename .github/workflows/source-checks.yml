name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run source and asset checks
        run: |
          python checktext.py
          python checkfaces.py
          python checkgfx.py
          python checkfields.py

      - name: Regenerate deterministic non-audio assets
        run: |
          python gen_font.py
          python gen_world.py
          python gen_battle.py
          python gen_sprites.py
          python gen_hdma.py
          python gen_title.py

      - name: Require generated assets to be current
        run: git diff --exit-code

  rom:
    name: Build ROM and play regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out game
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Check out pinned SNES toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: alekmaul/pvsneslib
          ref: e090f001ccffdc0fb69f479a8c9703e30d07f6b1
          path: build/pvsneslib
          submodules: recursive
          persist-credentials: false
      - name: Check out pinned emulator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: libretro/snes9x
          ref: 5a40cd5514e63e691e39141d64267798357a1424
          path: build/snes9x
          persist-credentials: false
      - name: Install build and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake doxygen libpng-dev zlib1g-dev
          python -m pip install Pillow==12.3.0
      - name: Build toolchain and emulator
        run: |
          export PVSNESLIB_HOME="$GITHUB_WORKSPACE/build/pvsneslib"
          make -C "$PVSNESLIB_HOME" compiler tools -j2
          make -C "$PVSNESLIB_HOME/pvsneslib" -j2
          make -C build/snes9x/libretro -j2
      - name: Build and validate ROM
        run: PVSNESLIB_HOME="$GITHUB_WORKSPACE/build/pvsneslib" make -j2
      - name: Play regression scenarios
        env:
          MESEN_S_CORE: ${{ github.workspace }}/build/snes9x/libretro/snes9x_libretro.so
        run: |
          python -u test_game.py
          python -u test_quests.py
          python -u test_campaign.py
